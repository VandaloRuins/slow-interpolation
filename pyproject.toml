[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slow-interpolation"
version = "0.0.1"
description = "Diffusion-based slow drift video: SDXL Lightning img2img chain, frequency-separated temporal smoothing, RIFE v4.25 64x linear interpolation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Luca Martinelli (Vandalo Ruins)"}]
keywords = ["diffusion", "sdxl", "rife", "interpolation", "generative-art", "lora"]
dependencies = [
    "torch",
    "torchvision",
    "diffusers>=0.30,<0.40",  # 0.38 verified; UNet-only LoRA fallback in keyframes.py covers 0.31+ Kohya text-encoder regression
    "transformers",
    "accelerate",
    "peft",
    "numpy",
    "pillow",
    "imageio",
    "imageio-ffmpeg",
    "pyyaml",
]

[project.optional-dependencies]
train = ["datasets", "bitsandbytes"]
live = ["mediapipe", "opencv-python"]
# cv2 is a REAL test dependency, not an optional one: tools/artefact_sim.py
# imports it at module level, tests/test_quality.py imports it directly, and
# quality.border_features needs it for the Sobel in b_orient. Without it the
# eight test_quality.py tests error out and the whole build stays red.
# HEADLESS specifically: the GUI build needs libGL.so.1, which the ubuntu-latest
# runner does not ship, so plain opencv-python trades ModuleNotFoundError for
# ImportError. Nothing in this repo calls the cv2 GUI functions.
# Do NOT install .[dev,live] together; both cv2 wheels claim the same namespace.
dev = ["pytest", "ruff", "ipykernel", "opencv-python-headless"]
# Optional cloud-render path. See docs/modal.md.
# Install with: pip install -e .[cloud]
# Modal SDK is intentionally NOT in core dependencies: users who never
# run the cloud path do not pull this in.
cloud = ["modal>=0.66"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
