# Renoir mixed-garden-bouquet slow drift, ~60 s loop.
#
# Tests the LoRA's range across the whole floral vocabulary (the dataset is
# dominated by mixed bouquets, so this is the trained-on case). Calm render
# profile keeps the brushwork moving slowly enough to read individual blooms.

style:
  name: renoir_flowers_epoch_10
  lora_path: models/loras/Renoir_Flowers_epoch_10.safetensors
  lora_scale: 0.80
  prefix: "rfl, "
  suffix: ", oil painting, impressionist"
  negative_prompt: "frame, vignette, panel, ornament, photograph, modern, sharp, photoreal"

subject:
  name: renoir_mixed_bouquet
  prompts:
    - label: "A: spring garden"
      prompt: >-
        a spring bouquet of mixed garden flowers in an earthenware pot,
        centered still life on a table, soft natural daylight, blush pinks and
        ivory against a slate-grey background, visible brushstrokes
    - label: "B: afternoon warm"
      prompt: >-
        the same mixed garden bouquet, blooms shifting, warm afternoon light,
        creamy whites and rose against a deep terracotta ground, layered
        impasto petals
    - label: "C: lavender cool"
      prompt: >-
        the same mixed garden bouquet, petals at full bloom, cool studio
        light, blue-greys and lavenders with green leaves catching highlights,
        loose painterly handling
    - label: "A (return)"
      prompt: >-
        a spring bouquet of mixed garden flowers in an earthenware pot,
        centered still life on a table, soft natural daylight, blush pinks and
        ivory against a slate-grey background, visible brushstrokes

render: calm

resolution:
  width: 1344
  height: 768

frames:
  steady: 5
  transition: 3
  return_: 4
  warmup: 3

rife:
  passes: 6
  skip_boundary: 4
  edge_crop: 0
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 24
  quality: 5
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

output_dir: outputs
