# Renoir pink-roses lifecycle, ~85 s loop. v6.
#
# v5 closed the loop cleanly but lost detail at prompt-change moments and on
# some RIFE-warped transitions. Two changes from v5 to attack the remaining
# softness:
#   1. Swap noise from default `evolved` to `banded_renoir_tuned` (the Round 4
#      Renoir winner: Worley cd=3000 + Perlin fs=16 + low-weight FBM). Banded
#      noise injects fine high-spatial-frequency texture every step, which
#      directly counteracts chain-softness during prompt-blended transition
#      frames. Cost lift: ~$0.05 -> ~$0.80-1.00 due to the dense Worley
#      component (kd-tree optimization is on the backlog per noise-sources.md).
#   2. frames.transition 5 -> 7. The transition frames use SLERP-blended
#      embeddings between adjacent prompts (a hybrid that describes neither
#      state fully), so the chain needs more steps to commit cleanly. More
#      transition frames also shrink the per-keyframe delta that RIFE has to
#      warp across, reducing interpolation softness.
#
# Kept from v5: per-prompt anti-bloom negatives on A/A-return, lora_scale 0.80
# (Renoir character), structural_decay_radius=0, return-segment overrides
# (frames.return_=10, return_pixel_blend_max=0.55, return_strength_end=0.45)
# for the clean loop closure Luca confirmed.

style:
  name: renoir_flowers_epoch_10
  lora_path: models/loras/Renoir_Flowers_epoch_10.safetensors
  lora_scale: 0.80
  prefix: "rfl, "
  suffix: ", oil painting, impressionist"
  negative_prompt: "frame, vignette, panel, ornament, photograph, modern, sharp, photoreal, macabre, gothic, horror"

subject:
  name: renoir_roses_lifecycle_v6
  prompts:
    - label: "A: bare stems"
      prompt: >-
        a dormant rose plant with bare leafy stems and no flowers at all, just
        green leaves and brown stems, gathered in a porcelain vase on a marble
        side table, warm afternoon light, warm grey studio ground, leafy
        greens and quiet browns, visible brushstrokes
      negative_prompt: "roses, rose, blooms, bloom, flowers, flower, open petals, full bloom, splayed petals, lush flowers, petals, floral, blossoms, buds, pink, frame, vignette, panel, ornament, photograph, modern, sharp, photoreal"
    - label: "B: full bloom"
      prompt: >-
        pink roses in heavy full bloom, abundant overlapping petals splayed
        wide with layered impasto, gathered in a porcelain vase on a marble
        side table, warm afternoon light, warm grey studio ground, creamy
        whites and deep rose with green leaves catching highlights
    - label: "C: withered dead"
      prompt: >-
        withered dead pink roses with shrivelled drooping petals, brown
        curling petals scattered across the marble side table, drooping dried
        stems, in a porcelain vase, warm afternoon light, warm grey studio
        ground, muted ochres and faded pinks, loose painterly handling
    - label: "A (return): bare stems"
      prompt: >-
        a dormant rose plant with bare leafy stems and no flowers at all, just
        green leaves and brown stems, gathered in a porcelain vase on a marble
        side table, warm afternoon light, warm grey studio ground, leafy
        greens and quiet browns, visible brushstrokes
      negative_prompt: "roses, rose, blooms, bloom, flowers, flower, open petals, full bloom, splayed petals, lush flowers, petals, floral, blossoms, buds, pink, frame, vignette, panel, ornament, photograph, modern, sharp, photoreal"

resolution:
  width: 1344
  height: 768

frames:
  steady: 6
  transition: 7
  return_: 10
  warmup: 3

render:
  structural_decay_radius: 0
  return_pixel_blend_max: 0.55
  return_strength_end: 0.45
  noise:
    kind: frequency_banded
    params:
      sources:
        - kind: worley
          params:
            cell_density: 3000.0
        - kind: perlin
          params:
            feature_size: 16.0
        - kind: fbm
          params:
            feature_size: 64.0
            octaves: 3
      band_sigmas: [0.0, 0.0, 4.0]
      band_weights: [0.5, 0.4, 0.1]

rife:
  passes: 6
  skip_boundary: 4
  edge_crop: 0
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 24
  quality: 5
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

output_dir: outputs
