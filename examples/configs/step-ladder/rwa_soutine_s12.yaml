# Step ladder rung: Soutine wildcard, steps 12
#
# Isolates: does a high-frequency gestural style need more steps than Cole does? Pairs with rw0
#
# Part of the 2026-08-07 step-ladder batch. See
# docs/findings/denoise-step-budget.md Finding 2 and
# docs/planning/workstreams/quality-first/progress.md T1.
#
# Every rung is identical except the lines marked CHANGED. Judge keyframe
# 0000 against 0006 in gallery.html: 0000 reads surface quality, the pair
# reads whether quality survives the chain. Sweep resolution 1344x768, NOT
# a delivery bucket.

style:
  name: soutine_figures_epoch_10
  lora_path: models/loras/Soutine_Figures_epoch_10.safetensors
  lora_scale: 0.85
  prefix: "stn, "
  suffix: ", dragging brush, twisted silhouette, oil painting, expressionist"
  negative_prompt: "photograph, 3D render, anime, cartoon, digital art, smooth blending, sharp edges, frame, border, signature, watermark, text"

subject:
  name: ladder_rwa_soutine_s12
  prompts:
    - label: "A: hillside ochre"
      prompt: >-
        warm ochre afternoon light, a hillside of leaning red-roofed houses
        churning across the slope, a road climbing between them, raw umber
        and slate ground
    - label: "B: hillside burning"
      prompt: >-
        low burning crimson light, a hillside of leaning red-roofed houses
        churning across the slope, a road climbing between them, deep slate
        and ember ground
    - label: "A (return)"
      prompt: >-
        warm ochre afternoon light, a hillside of leaning red-roofed houses
        churning across the slope, a road climbing between them, raw umber
        and slate ground

resolution:
  width: 1344
  height: 768

frames:
  steady: 2
  transition: 1
  return_: 1
  warmup: 3

sampling:
  num_inference_steps: 12
  guidance_scale: 1.5

rife:
  passes: 6
  skip_boundary: 4
  edge_crop: 0
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 30
  quality: 9
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: ByteDance/SDXL-Lightning
  lightning_weight_name: sdxl_lightning_4step_lora.safetensors
  vae: madebyollin/taesdxl
  vae_full: madebyollin/sdxl-vae-fp16-fix
  vae_kind: tiny

modal:
  gpu: L40S
  preserve_staging: true

output_dir: outputs/step-ladder
