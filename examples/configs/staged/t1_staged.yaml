# T1: does an EXTERNALLY authored keyframe set interpolate as drift, or as morphing?
# Keyframes were rendered independently at a fixed seed by tools/stage_keyframes.py
# (no img2img chaining) and uploaded to staging/t1_staged/keyframes/. Phase A is
# skipped entirely. skip_boundary 8 because Gemini scored that the best motion.
# Frame 0 and frame 6 share prompt AND seed, so the loop should close exactly.

style:
  name: thomas_cole_epoch_10
  lora_path: models/loras/Thomas_Cole_epoch_10.safetensors
  lora_scale: 0.75
  prefix: "tcole, romantic oil painting, Hudson River School style, "
  suffix: ""
  negative_prompt: "picture frame, ornate border, vignette, canvas edge, artist signature, watermark, photograph, blurry"

subject:
  name: t1_staged
  prompts:
    - label: "A: consummation, dusk"
      prompt: >-
        deep blue dusk light, a towering wedge-shaped building at the fork of two crowded avenues, gaslit windows and banners, dense crowds in the street, seen from the street
    - label: "B: consummation, gaslight"
      prompt: >-
        warm golden gaslight, a towering wedge-shaped building at the fork of two crowded avenues, blazing windows and banners, dense crowds in the street, seen from the street
    - label: "A (return)"
      prompt: >-
        deep blue dusk light, a towering wedge-shaped building at the fork of two crowded avenues, gaslit windows and banners, dense crowds in the street, seen from the street

resolution:
  width: 1344
  height: 768

frames:
  steady: 2
  transition: 1
  return_: 1
  warmup: 3

sampling:
  num_inference_steps: 4
  guidance_scale: 1.5

rife:
  passes: 6
  skip_boundary: 8
  edge_crop: 0
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 30
  quality: 9
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: ByteDance/SDXL-Lightning
  lightning_weight_name: sdxl_lightning_4step_lora.safetensors
  vae: madebyollin/taesdxl
  vae_full: madebyollin/sdxl-vae-fp16-fix
  vae_kind: full

modal:
  gpu: L40S
  preserve_staging: true
  skip_keyframes: true

output_dir: outputs/staged
