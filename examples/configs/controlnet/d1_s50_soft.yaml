# 0.50 scale on the softened map

# Material correction: Flattest, coolest register: no directional sun at all.
#
# Every render so far came back RED BRICK because nothing in the prompt named a
# stone and nothing in the negative excluded one, so the LoRA's default won.
# Cole's Course of Empire is white marble and colonnades. Brick is also a warm
# material, so this should pull the measured warm bias down as a side effect.
# Value structure preserved by moving the darks to the FOREGROUND, since the
# buildings can no longer supply them.

style:
  name: thomas_cole_epoch_10
  lora_path: models/loras/Thomas_Cole_epoch_10.safetensors
  lora_scale: 0.90
  prefix: "tcole, romantic oil painting, Hudson River School style, "
  suffix: ""
  negative_prompt: "picture frame, ornate border, vignette, canvas edge, artist signature, watermark, photograph, blurry, sepia, yellowed varnish, orange cast, brown monochrome, red brick, brickwork, terracotta, rust"

subject:
  name: cn_d1_s50_soft
  prompts:
    - label: "A"
      prompt: >-
        pale grey dawn light on white marble, two great avenues converging into a narrow triangular plaza, a tall white marble wedge tower at the apex crowned with a sphere, pale marble colonnades on both sides, deep foreground shadow
    - label: "B"
      prompt: >-
        cool overcast noon on white marble, two great avenues converging into a narrow triangular plaza, a tall white marble wedge tower at the apex crowned with a sphere, pale marble colonnades on both sides, deep foreground shadow
    - label: "A (return)"
      prompt: >-
        pale grey dawn light on white marble, two great avenues converging into a narrow triangular plaza, a tall white marble wedge tower at the apex crowned with a sphere, pale marble colonnades on both sides, deep foreground shadow

resolution:
  width: 1344
  height: 768

frames:
  steady: 2
  transition: 1
  return_: 1
  warmup: 3

sampling:
  num_inference_steps: 12
  guidance_scale: 1.5

rife:
  passes: 6
  skip_boundary: 8
  edge_crop: 0
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 30
  quality: 9
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: ByteDance/SDXL-Lightning
  lightning_weight_name: sdxl_lightning_4step_lora.safetensors
  vae: madebyollin/taesdxl
  vae_full: madebyollin/sdxl-vae-fp16-fix
  vae_kind: full

modal:
  gpu: L40S
  preserve_staging: true

output_dir: outputs/controlnet

anchor_image: outputs/_anchors/times-square-neutral.png
anchor_strength: 0.5

control:
  model: diffusers/controlnet-depth-sdxl-1.0
  image: outputs/_anchors/times-square-depth-soft.png
  scale: 0.5
  guidance_start: 0.0
  guidance_end: 0.6
