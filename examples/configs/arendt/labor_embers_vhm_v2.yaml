# TEST 2, OUT-OF-REGISTER. Arendt series, Labor cluster. Answers PL16.
#
# Question: does vhm have the firelit register at all? L44 predicts it renders
# a night or firelit scene as PALE DAYLIGHT, because the Hammershoi corpus has
# no nocturnes. If that happens, PL16 closes on evidence (vhm stays
# daylight-only). If the fire holds, PL16 reopens toward a v2 dataset. Either
# outcome is a first-class result; this config is built so the answer is
# readable in both directions.
#
# Paired with work_chair_anchored_daykf.yaml (TEST 1, in-register control).
# Mechanically IDENTICAL to it: anchor-only at 0.45 / warmup 1, seed 1087, same
# frame counts, same sampler, same LoRA and scale, no ControlNet in either. The
# ONLY difference between the two runs is the register of the anchored scene
# and the prompts that describe it. That is what lets the pair separate "does
# the anchored base chain work" from "does vhm have the register".
#
# ---------------------------------------------------------------------------
# WHY THERE IS NO `control:` BLOCK
# ---------------------------------------------------------------------------
# The only drawn map in this cluster is work_chair_map.png, a CHAIR. Pointing a
# chair depth map at a stove anchor is exactly the mixed-source failure that
# killed the earlier arendt_labor_embers_vhm_anchor run today (embers anchor +
# work_chair prompts + work_chair map). The anchor carries the composition on
# its own; nothing else is allowed to disagree with it.
#
# NOTE on the negative prompt: it is left byte-identical to the vhm family
# preset, including "saturated color". That clause is deliberately NOT removed.
# L44's prediction is a LUMINANCE failure (firelit scene comes out as pale
# daylight), and nothing in the negative touches luminance or darkness, so the
# preset cannot manufacture the predicted outcome. Changing the preset here
# would have made a pale result arguable instead of decisive.

seed: 1087
output_name: arendt_labor_embers_vhm_v2

# TOP LEVEL, not under render:. config.py:521-523 reads these from the YAML
# ROOT only; nested under render: they are inert.
anchor_image: outputs/arendt/anchors/labor_embers_kf0.png
anchor_strength: 0.45

style:
  name: hammershoi_interiors_epoch_10
  lora_path: models/loras/Hammershoi_Interiors_epoch_10.safetensors
  lora_scale: 0.80
  prefix: "vhm, "
  suffix: ", smooth blended tonal gradients, sfumato, oil painting"
  negative_prompt: "photograph, 3D render, digital art, saturated color, impasto, thick paint, heavy brushstrokes, signature, watermark, frame, border, canvas edge, people, figures"

# Written against labor_embers_kf0.png 2026-08-14: dark interior, cast-iron
# stove with its door swung open, a black pot over glowing embers in the
# firebox, warm firelight on the surrounding wall and stone floor, ash and
# coal on the hearth, no people. Light-only discipline holds: the subject
# clause is byte-identical across A/B/A, only the light phrase moves.
# Arc: embers low -> fire risen -> dying back.
subject:
  name: arendt_labor_embers_vhm_v2
  prompts:
    - label: "A: embers low"
      prompt: >-
        a dark interior at night lit only by low dying embers, deep shadow
        filling the room, a faint dull red glow, a black iron pot standing
        over glowing embers inside the open firebox of a cast-iron stove, its
        heavy door swung open, ash and coal on the stone hearth, plain dark
        wall behind, no people
    - label: "B: fire risen"
      prompt: >-
        a dark interior at night with the fire risen, strong warm orange
        firelight spilling out of the open stove door across the wall and the
        stone floor, long flickering shadows, a black iron pot standing
        over glowing embers inside the open firebox of a cast-iron stove, its
        heavy door swung open, ash and coal on the stone hearth, plain dark
        wall behind, no people
    - label: "A (return): embers dying back"
      prompt: >-
        a dark interior at night lit only by low dying embers, deep shadow
        filling the room, a faint dull red glow, a black iron pot standing
        over glowing embers inside the open firebox of a cast-iron stove, its
        heavy door swung open, ash and coal on the stone hearth, plain dark
        wall behind, no people

resolution:
  width: 1408
  height: 768

# K = (2+1) + (4+2) + 1 = 10. warmup 1 is MANDATORY with an anchor (L17):
# warmup pass 2+ runs at a hardcoded 0.75 and repaints away the composition
# the anchor exists to preserve (keyframes.py:416).
frames:
  steady: 2
  steady_per_segment: [2, 4]
  transition: 1
  return_: 2
  warmup: 1

render:
  structural_decay_radius: 1
  steady_strengths: [0.35, 0.35, 0.35, 0.35, 0.35, 0.35, 0.35, 0.35]
  transition_strength: 0.38
  return_strength_start: 0.35
  return_strength_end: 0.30
  return_pixel_blend_max: 0.45

sampling:
  num_inference_steps: 40
  guidance_scale: 6.0

rife:
  passes: 5
  skip_boundary: 0
  edge_crop: 0
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 30
  quality: 9
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: null
  vae: madebyollin/taesdxl
  vae_full: madebyollin/sdxl-vae-fp16-fix
  vae_kind: full

modal:
  gpu: L40S
  preserve_staging: true
  notes:
    - "TEST 2 of the anchored pair: out-of-register firelit interior, answers PL16."
    - "No ControlNet: the only cluster map is a chair and would fight this anchor."

output_dir: outputs/arendt
