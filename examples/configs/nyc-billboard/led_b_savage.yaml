# LED wall, screen B. 1728 x 540, 16:5 landscape, 10.000 s, 30 fps.
#
# Stage I of the cycle, from the headland: the crag close on the LEFT, a wide
# bay, a low wooded shore far across the water, no buildings. Three masses,
# the lowest element count in the whole triptych and the most stable content
# the empire run measured (per-frame change 0.827 against the city's 1.231).
#
# C is this same vantage mirrored, after the empire: same waterline, same
# horizon, crag on the right. The two 16:5 screens are one place at two
# moments, and A is the view back from the city between them.
#
# GEOMETRY, the thing that made these maps new work rather than a reuse:
# render 1536x896 -> edge_crop 8 -> conform crops 1520x474 at y=0 -> lanczos
# 1.137x to 1728x540. Only the TOP 474 px is delivered, i.e. y 8..482 of 896.
# The harbour armature in tools/make_massing.py puts the near shore at 0.78h
# and the crag from 0.585h down; all of it falls below this cut. Everything is
# re-authored inside the surviving band, and the bottom 47% of the render is
# paint-out that supports the visible sliver and is then discarded.
#
# Crop y MUST be 0, not centre. conform.py defaults to centre, which here
# would take y 208..682 and cut the crag's head off.
#     python tools/conform.py --screen bc --crop-y 0 --src <render>.mp4
#
# Drift is light only: storm light to pale cold light and back, seamless.

style:
  name: thomas_cole_epoch_10
  lora_path: models/loras/Thomas_Cole_epoch_10.safetensors
  lora_scale: 0.90
  prefix: "tcole, romantic oil painting, Hudson River School style, "
  suffix: ""
  negative_prompt: "picture frame, ornate border, vignette, canvas edge, artist signature, watermark, photograph, blurry, sepia, yellowed varnish, brown monochrome, buildings, towers, city"

subject:
  name: led_b_savage
  # Light term FIRST. Measured on both SDXL tokenizers: 48 and 49 tokens
  # against a 62 target, so there is real BPE slack.
  prompts:
    - label: "A: storm light"
      prompt: >-
        storm light breaking through heavy cloud, a great rocky crag rising
        close on the left, a wide grey bay, a long low wooded shore far across
        the water, no buildings
    - label: "B: pale cold light"
      prompt: >-
        pale cold light breaking through torn cloud, a great rocky crag rising
        close on the left, a wide silver bay, a long low wooded shore far
        across the water, no buildings
    - label: "A (return)"
      prompt: >-
        storm light breaking through heavy cloud, a great rocky crag rising
        close on the left, a wide grey bay, a long low wooded shore far across
        the water, no buildings

resolution:
  width: 1536
  height: 896

# 3 prompts -> 2 segments. K = (4+2) + (4+4) + 1 = 15 keyframes.
# Raw = 15 * 23 - 1 = 344, retimed by conform.py to exactly 300. Floor is 300,
# so K must be >= 14 at passes 5.
frames:
  steady: 4
  transition: 2
  return_: 4
  warmup: 3

render:
  structural_decay_radius: 1
  # 8 real steps: int(24 * 0.36) = 8, band [0.3333, 0.375). See led_a_terrace.
  steady_strengths: [0.36, 0.36, 0.37, 0.36, 0.36, 0.37, 0.36, 0.37]
  transition_strength: 0.38
  return_strength_start: 0.36
  return_strength_end: 0.30
  return_pixel_blend_max: 0.35

sampling:
  num_inference_steps: 24
  guidance_scale: 1.5

control:
  model: diffusers/controlnet-depth-sdxl-1.0
  image: outputs/_anchors/led-b-savage.png
  scale: 0.65
  guidance_start: 0.0
  guidance_end: 0.6

rife:
  passes: 5
  skip_boundary: 4
  edge_crop: 8
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 30
  quality: 9
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: ByteDance/SDXL-Lightning
  lightning_weight_name: sdxl_lightning_4step_lora.safetensors
  vae: madebyollin/taesdxl
  vae_full: madebyollin/sdxl-vae-fp16-fix
  vae_kind: full

modal:
  gpu: L40S
  preserve_staging: true

output_dir: outputs/nyc-billboard/led
