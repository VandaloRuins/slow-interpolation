# LED wall, screen C. 1728 x 540, 16:5 landscape, 10.000 s, 30 fps.
# Identical delivery spec to B, and deliberately the same picture inverted.
#
# Stage V of the cycle, from the same headland as B, mirrored: the crag close
# on the RIGHT, still black water, five broken towers on the low shore far
# across the bay. Same waterline, same horizon height, same shelf. B and C are
# one place before and after, which is Cole's whole argument, and the mirror
# makes them read as a matched pair whatever the physical hang.
#
# Four masses. The five stumps are the only itemised distant content anywhere
# in the triptych, and they are low, few and hazy on purpose: v9 established
# that fewer, larger, flatter-contrast masses is the one thing that ever
# improved a distant skyline (image 9/10, best of ten renders).
#
# Same geometry note as B: only the TOP 474 px of the 896 render is delivered.
#     python tools/conform.py --screen bc --crop-y 0 --src <render>.mp4
#
# Drift is light only: cold blue moonlight to pale silver and back, seamless.

style:
  name: thomas_cole_epoch_10
  lora_path: models/loras/Thomas_Cole_epoch_10.safetensors
  lora_scale: 0.90
  prefix: "tcole, romantic oil painting, Hudson River School style, "
  suffix: ""
  # v9's desolation negative: the Cole LoRA's distribution pulls hard toward
  # golden hour, and a night stage has to suppress it explicitly or the whole
  # stage warms up. 44 tokens, inside budget.
  negative_prompt: "picture frame, ornate border, vignette, canvas edge, artist signature, watermark, photograph, blurry, sepia, yellowed varnish, brown monochrome, golden hour, sunset, warm light, fire, foliage"

subject:
  name: led_c_desolation
  # Light term FIRST. Both bodies measure 47 tokens on both SDXL tokenizers.
  prompts:
    - label: "A: cold blue moonlight"
      prompt: >-
        cold blue moonlight, a great rocky crag rising close on the right,
        still black water, broken ruined towers on a low shore far across the
        water, empty, no people
    - label: "B: pale silver moonlight"
      prompt: >-
        pale silver moonlight, a great rocky crag rising close on the right,
        still black water, broken ruined towers on a low shore far across the
        water, empty, no people
    - label: "A (return)"
      prompt: >-
        cold blue moonlight, a great rocky crag rising close on the right,
        still black water, broken ruined towers on a low shore far across the
        water, empty, no people

resolution:
  width: 1536
  height: 896

frames:
  steady: 4
  transition: 2
  return_: 4
  warmup: 3

render:
  structural_decay_radius: 1
  steady_strengths: [0.36, 0.36, 0.37, 0.36, 0.36, 0.37, 0.36, 0.37]
  transition_strength: 0.38
  return_strength_start: 0.36
  return_strength_end: 0.30
  return_pixel_blend_max: 0.35

sampling:
  num_inference_steps: 24
  guidance_scale: 1.5

control:
  model: diffusers/controlnet-depth-sdxl-1.0
  image: outputs/_anchors/led-c-desolation.png
  scale: 0.65
  guidance_start: 0.0
  guidance_end: 0.6

rife:
  passes: 5
  skip_boundary: 4
  edge_crop: 8
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 30
  quality: 9
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: ByteDance/SDXL-Lightning
  lightning_weight_name: sdxl_lightning_4step_lora.safetensors
  vae: madebyollin/taesdxl
  vae_full: madebyollin/sdxl-vae-fp16-fix
  vae_kind: full

modal:
  gpu: L40S
  preserve_staging: true

output_dir: outputs/nyc-billboard/led
