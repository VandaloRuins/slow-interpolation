# LED wall, 16:5 band. 1536x896 render -> 1728x540 delivered, 10.000 s, 30 fps.
#
# STYLE SWEEP. Luca 2026-08-11: "drop the Course of Empire reference, work on subjects
# in the art styles we have loras trained for ... this is an exercise of style, no
# conceptual work, can the outputs be really just beautiful?"
#
# So: no narrative, no landmark, no arc. One subject per LoRA that the LoRA was
# actually trained on, and the only thing that moves across the loop is the LIGHT.
#
# NO CONTROL MAP, on purpose. The 16:5 delivery keeps only rows 288 to 762, a 53%
# band. A composition with a horizon and a focal point needs a map to survive that
# crop; an ALL-OVER FIELD does not, because every band is an equally good crop and
# the same subject also works vertically. That is open direction D1(b), and it is
# what makes a pure style exercise possible at this geometry.
#
# INTERPOLATION IS THE led17 RECIPE, measured the same day: K=10 at passes 5 with
# skip_boundary 0 gives 10 * 31 - 1 = 309 raw frames. skip_boundary 0 makes a keyframe
# crossing an ordinary frame instead of a 9x lurch (measured 2.31 -> 0.99), and landing
# on 309 means conform drops 9 frames instead of 139, which took frame-to-frame
# roughness 0.55 -> 0.18. Strengths are the matching coupled-dial value, 9 real steps
# at 20, and lowering them nearly doubled the light arc on both screens.
#
# THE BACKBONE TEST, queued since 2026-05-19 and never once run through the video
# pipeline. Every render to date fuses the SDXL-Lightning 4-step LoRA and then asks
# it for 20 steps, which is off-distribution for a 4-step distillation. Luca's own
# verdict on 2026-05-19, at keyframe level with a LoRA applied, was "sdxl base reads
# more the painting brush". This runs pure base: lightning_lora null, 24 steps, and
# guidance 6.0, because base needs real classifier-free guidance where Lightning
# needs almost none.
#
# It answers TWO questions at once, deliberately. Base gives finer control over how
# much a keyframe changes, which is the morphing lever, AND at guidance 6.0 the
# negative branch finally carries weight, so the canvas-edge ban that L25 measured
# inert at 1.5 should bite. If it does, the edge fix and the morphing fix are the
# same change. Expect it to cost more than the usual $0.045.
# BASE STRENGTH LADDER, rung s35. led19_renoir_base gave the best image of any
# render (Gemini image 9, no morph or blur flag surviving a majority vote, canvas
# edge gone) on a chain that was too hot: lurch 0.01 -> 2.09 and flicker 2 -> 24
# against its Lightning twin. Cause: it was run at LIGHTNING's strength. At 24
# steps, 0.46 is 11 real steps of a NON-distilled model, a far heavier repaint
# than 9 Lightning steps.
#
# This rung is 0.35, i.e. int(24 * 0.35) = 8 real steps.
#
# WHAT TO MEASURE, and it is now measurable. `kf_ssim` from
# `slow_interpolation.quality` says how much consecutive keyframes agree, which
# is how much RIFE has to invent, which is the mechanism behind rubbery morphing.
# Same-subject evidence: led18_renoir_field (Lightning) 0.353 against
# led19_renoir_base (base) 0.787. Lower strength should push it higher still. The
# trade is the light arc: repaint too little and the image stops evolving. So the
# ladder is looking for the knee, not the maximum.
#
# THE LAST CHEAP LEVER ON THE WARM-UP RAMP, and it is here because reasoning about
# the other two was wrong twice. led21_s35_lownoise cut steady_noise_blend 0.08 -> 0.03
# on the theory that the model could not resolve injected noise at 8 steps; it made the
# render 10x SOFTER mid-chain (kf5 18.6 -> 1.7), so the noise walk is a SOURCE of
# detail, not a contaminant. led21_s35_frontload gave each segment a hot start; it held
# sharpness, trimmed the ramp 4.16x -> 3.32x, and broke the loop (Gemini loop 9 -> 6),
# because segment 1 restarts hot at keyframe 2.
#
# So: warmup 3 -> 8. The warmup loop runs pass 0 at 0.85 and every later pass at a
# hardcoded 0.75 (keyframes.py:416), i.e. 20 then 18 real steps of base. If three of
# those still leave keyframe 0 at 3.2 against keyframe 7's 34.1, either more passes
# converge it or the ramp is intrinsic to the chain and no warmup setting touches it.
# Either answer closes the question. Costs no frames: warmup builds the canvas before
# keyframe 0 and adds nothing to the output.
#
#     python tools/conform.py --screen bc --crop-y 288 --src <render>.mp4

seed: 1087

style:
  name: renoir_flowers_epoch_10
  lora_path: models/loras/Renoir_Flowers_epoch_10.safetensors
  lora_scale: 0.85
  prefix: "rfl, "
  suffix: ""
  negative_prompt: "photograph, 3D render, digital art, smooth blending, picture frame, ornate border, vignette, canvas edge, artist signature, watermark, blurry, text, people, figures, vase, tabletop"

subject:
  name: led21_s35_warm8
  # Subject clause byte-identical across A and B; only the light phrase moves (L21).
  prompts:
    - label: "A: cool blue dawn light"
      prompt: >-
        cool blue dawn light, a dense mass of garden flowers filling the whole frame, peonies poppies and green leaves, thick impasto
    - label: "B: warm golden sunlight"
      prompt: >-
        warm golden sunlight, a dense mass of garden flowers filling the whole frame, peonies poppies and green leaves, thick impasto
    - label: "A (return): cool blue dawn light"
      prompt: >-
        cool blue dawn light, a dense mass of garden flowers filling the whole frame, peonies poppies and green leaves, thick impasto

resolution:
  width: 1536
  height: 896

# K = (2+1) + (4+2) + 1 = 10. raw = 10 * 31 - 1 = 309, nine frames from target.
frames:
  steady: 2
  steady_per_segment: [2, 4]
  transition: 1
  return_: 2
  warmup: 8

render:
  structural_decay_radius: 1
  steady_strengths: [0.35, 0.35, 0.35, 0.35, 0.35, 0.35, 0.35, 0.35]
  transition_strength: 0.38
  return_strength_start: 0.35
  return_strength_end: 0.3
  return_pixel_blend_max: 0.45

sampling:
  num_inference_steps: 24
  guidance_scale: 6.0

rife:
  passes: 5
  skip_boundary: 0
  edge_crop: 8
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 30
  quality: 9
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: null            # PURE SDXL BASE
  vae: madebyollin/taesdxl
  vae_full: madebyollin/sdxl-vae-fp16-fix
  vae_kind: full

modal:
  gpu: L40S
  preserve_staging: true

output_dir: outputs/nyc-billboard/led
