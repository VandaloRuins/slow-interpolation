# LED wall, screen A. 912 x 2736, 1:3 PORTRAIT, 10.000 s, 30 fps.
#
# FIRST TEST OF DIRECTIONAL MOTION. Everything before this made still pictures
# whose light drifts. This adds a second, independent axis: the water falls
# while the rock does not move at all.
#
# THE MECHANISM. `motion` displaces a masked region of the previous frame
# downward before it re-enters img2img, so consecutive keyframes differ by a
# clean translation of the water and by nothing at all in the rock. RIFE then
# estimates per-pixel optical flow between them: non-zero over the water, and
# EXACTLY ZERO over the cliffs. So it advances the fall smoothly and leaves the
# stone untouched and sharp. The contrast is not engineered, it is what a
# per-pixel flow interpolator does for free.
#
# This inverts how RIFE has been read in this repo. It blurs when consecutive
# keyframes disagree in ways flow cannot explain, which is what a reinvented
# skyline or a wandering waterline does. A clean translation is the one kind of
# disagreement it handles perfectly. And because the cliffs have zero flow,
# they get NO mid-pair sharpness pulse either: the softness lands only on the
# water, which is the one place softness is correct.
#
# THE MASK IS FREE. It is the dark region of the control map. Water is already
# drawn black there, meaning "far, unconstrained, paint what the prompt says",
# and that same region is what should move. One asset, two jobs, no hand mask.
# Measured coverage: 28% of the frame.
#
# skip_boundary: 0, AND THIS IS THE POINT THAT MATTERS. It discards the
# invented frames nearest each keyframe, which is right for content drift. For
# a rigid translation it instead inserts a positional JUMP at every keyframe of
# about 2*skip/2^passes of the step, so at the usual 4 the water would stutter
# 10 times in 10 seconds. Motion work wants 0. This is the exact opposite of
# the tuning the light-only configs want, so the two cannot share a preset.
#
# LOOP CLOSURE, the open risk. The fall is a one-way translation and never
# returns, so a naive version ends with the water somewhere else and the wrap
# pair plays it backwards. This config sets the per-keyframe step so that the
# TOTAL over the loop is one full frame height (10 x 154 = 1540 against 1536):
# the water is completely renewed exactly once, so the last keyframe should be
# statistically identical to the first rather than offset from it. The return
# segment's pixel pull toward the anchor is switched off for the same reason,
# since it would drag the water back up and fight the fall.
#
# Whether that actually closes is the thing this render is for. Watch the last
# 30 frames for a reversal or a jump. If it seams, the fallback is a
# half-period cross-dissolve in conform.py, which is standard for flowing-water
# loops and costs some ghosting that water hides well.
#
#     python tools/conform.py --screen a --src <render>.mp4

seed: 1087

style:
  name: thomas_cole_epoch_10
  lora_path: models/loras/Thomas_Cole_epoch_10.safetensors
  lora_scale: 0.90
  prefix: "tcole, romantic oil painting, Hudson River School style, "
  suffix: ""
  negative_prompt: "picture frame, ornate border, vignette, canvas edge, artist signature, watermark, photograph, blurry, sepia, yellowed varnish, brown monochrome, people, figures, buildings"

subject:
  name: led4_a_fall
  # Light barely moves here on purpose. This render is testing MOTION, and a
  # large light arc would confound the read. 40 and 43 tokens.
  prompts:
    - label: "A: grey daylight"
      prompt: >-
        soft grey daylight, a tall waterfall falling down a dark rocky gorge,
        wet cliff walls either side, white spray at the foot, no people
    - label: "B: sun into the gorge"
      prompt: >-
        pale sunlight breaking into the gorge, a tall waterfall falling down a
        dark rocky gorge, wet cliff walls either side, white spray at the foot,
        no people
    - label: "A (return)"
      prompt: >-
        soft grey daylight, a tall waterfall falling down a dark rocky gorge,
        wet cliff walls either side, white spray at the foot, no people

resolution:
  width: 896
  height: 1536

# K = (3+1) + (3+2) + 1 = 10 keyframes.
# raw = K * (2^5 - 1 - 0) - 1 = 10 * 31 - 1 = 309, retimed to 300 (1.03x).
frames:
  steady: 3
  transition: 1
  return_: 2
  warmup: 3

# 154 px per keyframe over 10 keyframes = 1540 px against a 1536 px frame, so
# the water traverses the full height exactly once across the loop. Per invented
# frame that is 154/31 = 5.0 px, comfortably inside what optical flow tracks.
motion:
  dy: 154
  dx: 0
  mask_threshold: 60
  mask_feather: 24

render:
  structural_decay_radius: 1
  steady_strengths: [0.40, 0.40, 0.42, 0.40, 0.40, 0.42, 0.40, 0.42]
  transition_strength: 0.42
  # Return behaves like a steady segment: no pixel pull toward the anchor,
  # which would drag the water back up and fight the fall.
  return_strength_start: 0.40
  return_strength_end: 0.40
  return_pixel_blend_max: 0.0

sampling:
  num_inference_steps: 20
  guidance_scale: 1.5

control:
  model: diffusers/controlnet-depth-sdxl-1.0
  image: outputs/_anchors/led4-a-fall.png
  scale: 0.65
  guidance_start: 0.0
  guidance_end: 0.6

rife:
  passes: 5
  skip_boundary: 0
  edge_crop: 8
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 30
  quality: 9
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: ByteDance/SDXL-Lightning
  lightning_weight_name: sdxl_lightning_4step_lora.safetensors
  vae: madebyollin/taesdxl
  vae_full: madebyollin/sdxl-vae-fp16-fix
  vae_kind: full

modal:
  gpu: L40S
  preserve_staging: true

output_dir: outputs/nyc-billboard/led
