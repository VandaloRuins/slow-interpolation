# LED wall, screen C. 1728 x 540, 16:5, 10.000 s, 30 fps.  FIFTH PASS.
#
# REALLOCATE, DO NOT ADD. led12 proved light can travel (arc swing 5.72 -> 8.77,
# and the arc stopped being spatially flat) but cost geometric stability:
# structural r trough-to-peak fell 0.965 -> 0.911, and the near shore repainted
# itself into pale sandstone slabs. It also revealed WHY the peak is short: the
# luminance maximum lands at 62% of the loop, which is the FIRST RETURN
# keyframe. The light is still climbing when the chain is told to turn around.
#
# So the arc is step-limited at the B pole, not strength-limited, and strength
# is the expensive lever. This moves the frame budget instead: `steady_per_segment
# [1, 3]` gives the A pole one keyframe and the B pole three, at IDENTICAL K=8,
# identical 439 raw frames, identical 1.46x retime and identical 0.8 Hz throb.
# The A pole can afford to lose two: warmup already establishes it with three
# passes at 0.85/0.75/0.75, the most authority anywhere in the render.
#
# Strengths are held at led12's values ON PURPOSE. This render isolates the
# reallocation; `led13_b_realloc_soft` is the same config with strength lowered,
# and running both is the only way to attribute a stability change to one of
# them. Note `steady_strengths` is indexed WITHIN a segment, so segment 0 reads
# [0] only and segment 1 reads [0],[1],[2].
#
# SCREEN C, and it also kills a defect: led12_c painted an unprompted standing
# FIGURE on the foreground ledge at the peak. C's negative banned warm light and
# foliage but never people. `people, figures, a standing figure` is added here.
# That is a second change, and it is deliberate: a negative either suppresses a
# figure or does not, and cannot interact with frame pacing, so the reallocation
# result stays attributable. It is constant across BOTH C variants, so the
# strength comparison between them is unaffected.
#
# STRENGTH LOWERED. Identical to led13_b_realloc except the denoise schedule:
# 0.58/0.60 -> 0.52/0.54, transition 0.62 -> 0.56, return 0.58->0.50 becomes
# 0.52->0.46. At 20 steps that is 10/10/10 real steps instead of 11/12/11.
#
# This is the OTHER half of the pair. led12 raised keyframe count and strength
# together, which the coupled-dial rule forbids, and lost structural stability
# (r 0.965 -> 0.911 on B, 0.894 -> 0.672 on C). Reallocation should recover the
# peak; this asks whether giving back some strength recovers the geometry
# without giving back the arc. Run against led13_b_realloc, not against led12.
#
#     python tools/conform.py --screen bc --crop-y 288 --src <render>.mp4

seed: 1087

style:
  name: thomas_cole_epoch_10
  lora_path: models/loras/Thomas_Cole_epoch_10.safetensors
  lora_scale: 0.90
  prefix: "tcole, romantic oil painting, Hudson River School style, "
  suffix: ""
  negative_prompt: "picture frame, ornate border, vignette, canvas edge, artist signature, watermark, photograph, blurry, sepia, yellowed varnish, brown monochrome, golden hour, sunset, warm light, daylight, fire, foliage, people, figures, a standing figure"

subject:
  name: led13_c_realloc_soft
  # Byte-identical to led3 / led12. Only the light phrase moves.
  prompts:
    - label: "A: starless black night, faint cold light"
      prompt: >-
        starless black night, faint cold light, a tall rocky crag on a shore in
        the foreground, still black water, broken ruined columns on a low shore
        far across the water
    - label: "B: full moonlight, silver on the water"
      prompt: >-
        full moonlight, silver on the water, a tall rocky crag on a shore in the
        foreground, still black water, broken ruined columns on a low shore far
        across the water
    - label: "A (return)"
      prompt: >-
        starless black night, faint cold light, a tall rocky crag on a shore in
        the foreground, still black water, broken ruined columns on a low shore
        far across the water

resolution:
  width: 1536
  height: 896

# K = (1+1) + (3+2) + 1 = 8, the same as led12. raw = 8 * 55 - 1 = 439.
frames:
  steady: 2
  steady_per_segment: [1, 3]
  transition: 1
  return_: 2
  warmup: 3

render:
  structural_decay_radius: 1
  # Lowered. At 20 steps: 10 / 10 / 10 real steps.
  steady_strengths: [0.52, 0.54, 0.52, 0.54, 0.52, 0.54, 0.52, 0.54]
  transition_strength: 0.56
  return_strength_start: 0.52
  return_strength_end: 0.46
  return_pixel_blend_max: 0.45

sampling:
  num_inference_steps: 20
  guidance_scale: 1.5

control:
  model: diffusers/controlnet-depth-sdxl-1.0
  image: outputs/_anchors/led2-c-desolation.png
  scale: 0.65
  guidance_start: 0.0
  guidance_end: 0.6

rife:
  passes: 6
  skip_boundary: 4
  edge_crop: 8
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 30
  quality: 9
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: ByteDance/SDXL-Lightning
  lightning_weight_name: sdxl_lightning_4step_lora.safetensors
  vae: madebyollin/taesdxl
  vae_full: madebyollin/sdxl-vae-fp16-fix
  vae_kind: full

modal:
  gpu: L40S
  preserve_staging: true

output_dir: outputs/nyc-billboard/led
