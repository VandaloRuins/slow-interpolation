# LED wall delivery, screen A (vertical). Worked example of the conform pattern.
#
# Target file: 912 W x 2736 H (1:3 portrait), 10.000 s, 30 fps, H.264.
# Render source: 896x1536 (transpose of the validated 1536x896 bucket, see
# docs/findings/upscale-source-resolution.md), centre-crop 512x1536, lanczos
# to 912x2736 (1.78x).
#
# Direction: one vertical motif. A single ruined arch head on, dark stone mass
# holding the top and bottom of the tall frame, one luminous opening burning
# through the middle band. Composition must live in the central 512 px column
# (x 192 to 704) because that is what survives the crop.
#
# Motion: single slow drift, amber to gold and back, seamless loop.

style:
  name: thomas_cole_epoch_10
  lora_path: models/loras/Thomas_Cole_epoch_10.safetensors
  lora_scale: 0.75
  prefix: "tcole, romantic landscape oil painting, Hudson River School style, "
  suffix: ""
  negative_prompt: "picture frame, ornate border, decorative arch around the edge, vignette, text, watermark, signature, people, figures, modern buildings, signage, cars"

subject:
  name: billboard_a_arch
  # Light term goes FIRST. The style prefix plus a long prompt overran CLIP's
  # 77-token limit on the first attempt (80 > 77), which silently truncated the
  # tail. The light descriptor is what drives the whole drift, so it must never
  # sit where it can be cut.
  prompts:
    - label: "A: arch amber"
      prompt: >-
        warm amber afternoon light, a single towering ruined stone arch centred
        head on, massive dark brickwork filling top and bottom, one tall bright
        opening at the centre revealing a luminous distant valley, hazy blue
        mountains beyond
    - label: "B: arch golden"
      prompt: >-
        low golden hour light, a single towering ruined stone arch centred head
        on, massive dark brickwork filling top and bottom, one tall burning gold
        opening at the centre revealing a luminous distant valley, glowing
        mountains beyond
    - label: "A (return)"
      prompt: >-
        warm amber afternoon light, a single towering ruined stone arch centred
        head on, massive dark brickwork filling top and bottom, one tall bright
        opening at the centre revealing a luminous distant valley, hazy blue
        mountains beyond

resolution:
  width: 896
  height: 1536

# 2 prompts-worth of segments at 2/1/1 gives 7 keyframes -> ~385 raw frames,
# subsampled to exactly 300. Few keyframes on purpose: fewer keyframes over a
# fixed 10 s means slower drift.
frames:
  steady: 2
  transition: 1
  return_: 1
  warmup: 3

rife:
  passes: 6
  skip_boundary: 4
  edge_crop: 0
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 30
  quality: 9
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: ByteDance/SDXL-Lightning
  lightning_weight_name: sdxl_lightning_4step_lora.safetensors
  vae: madebyollin/taesdxl

output_dir: outputs/nyc-billboard