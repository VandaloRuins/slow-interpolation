# LED wall, screen A, second pass. 912 x 2736, 1:3 PORTRAIT, 10.000 s, 30 fps.
#
# A is the one screen that needed more than a parameter change. v1 asked for
# "bright silver midday light, seen from a shadowed marble terrace" and got
# flat, poster-like paint: hard washes, no atmosphere, nothing like the oil
# surface B and C came back with. Flat light produces flat painting, and that
# is the whole difference. The terrace framing also never appeared, because
# the depth map was too black to assert it (see led_b_savage_v2.yaml).
#
# So A drops the Consummation framing and becomes the third view of the same
# water, driven by the thing that actually worked on the other two screens:
# weather. A 1:3 frame suits it, because a storm sky is naturally a tall
# column. Sky above, the crag mid-frame, still water below.
#
# The recurring anchor survives this change, and arguably improves: the crag
# now appears in all three screens as the same kind of object rather than
# being distant architecture on one of them.
#
# NO ANCHOR IMAGE here, unlike B and C. Their compositions were worth keeping
# and could not be re-rolled; this one is being deliberately replaced. `seed`
# makes the result reproducible from now on, which is the point of adding it:
# if this composition is good, it can be iterated on instead of gambled for.
# Hence also `warmup: 3`, the from-noise default, rather than B and C's 1.
#
# Crop by eye from a still, do not assume centre. v1's central column landed
# on a rock face while the subject sat in the right third.

seed: 1087

style:
  name: thomas_cole_epoch_10
  lora_path: models/loras/Thomas_Cole_epoch_10.safetensors
  lora_scale: 0.90
  prefix: "tcole, romantic oil painting, Hudson River School style, "
  suffix: ""
  negative_prompt: "picture frame, ornate border, vignette, canvas edge, artist signature, watermark, photograph, blurry, sepia, yellowed varnish, brown monochrome, buildings, towers, city, flat poster colours"

subject:
  name: led_a_storm
  # Subject clause byte-identical. Only "dim" against "bright storm light
  # breaking" moves. Measured 45 and 46 tokens on both SDXL tokenizers.
  prompts:
    - label: "A: dim storm light"
      prompt: >-
        dim storm light through towering cloud, a great rocky crag rising from
        a wide bay seen from a high shore, tall clouds above, still water
        below, no buildings
    - label: "B: bright storm light"
      prompt: >-
        bright storm light breaking through towering cloud, a great rocky crag
        rising from a wide bay seen from a high shore, tall clouds above, still
        water below, no buildings
    - label: "A (return)"
      prompt: >-
        dim storm light through towering cloud, a great rocky crag rising from
        a wide bay seen from a high shore, tall clouds above, still water
        below, no buildings

resolution:
  width: 896
  height: 1536

frames:
  steady: 5
  transition: 1
  return_: 3
  warmup: 3

render:
  structural_decay_radius: 1
  steady_strengths: [0.30, 0.30, 0.31, 0.30, 0.30, 0.31, 0.30, 0.31]
  transition_strength: 0.31
  return_strength_start: 0.30
  return_strength_end: 0.26
  return_pixel_blend_max: 0.35

sampling:
  num_inference_steps: 28
  guidance_scale: 1.5

rife:
  passes: 5
  skip_boundary: 4
  edge_crop: 8
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 30
  quality: 9
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: ByteDance/SDXL-Lightning
  lightning_weight_name: sdxl_lightning_4step_lora.safetensors
  vae: madebyollin/taesdxl
  vae_full: madebyollin/sdxl-vae-fp16-fix
  vae_kind: full

modal:
  gpu: L40S
  preserve_staging: true

output_dir: outputs/nyc-billboard/led
