# Border-test render 2 of 2.
#
# Goal: probe whether EDGE_CROP=8 is still load-bearing for the Casa del Suono
# fresco LoRA. This LoRA is the one historically most aggressive about painting
# decorative arches at the frame edge (trained on Casa del Suono frescoes with
# arched architecture, see legacy/choire-v2/research/video-generation-iterations.md
# Obstacle 5). If the no-crop test passes here, it almost certainly passes
# everywhere.
#
# Subject: closeup view of a frog pond with lillypads and frogs. A nature
# closeup is also a deliberate stress case: it has no inherent reason to
# include a frame, so any frame the model paints is a pure LoRA artifact.
#
# Frame layout same as the tcole pastoral test (10 keyframes, ~22.9s output).

style:
  name: casa_del_suono_epoch_4
  lora_path: models/loras/SDXL_CASA_DEL_SUONO_epoch_4.safetensors
  lora_scale: 0.35
  prefix: "Italian fresco on aged plaster, warm chiaroscuro, visible brushwork, terracotta and ochre palette, "
  suffix: ""
  negative_prompt: >-
    person, human, figure, religious, angel, halo, saint, putti, picture
    frame, decorative arch, ornate border, framed painting, gilded frame,
    vignette, dark border, dark vignette, fresco panel, painted frame

subject:
  name: casa_frog_pond
  prompts:
    - label: "A: Frog pond amber"
      prompt: >-
        extreme closeup of a still frog pond surface filling the entire frame,
        broad green lillypads floating on the dark calm water, two small
        speckled frogs perched on separate lillypads, dappled warm sunlight
        reflecting on the water surface, scattered duckweed and reeds at the
        margins, fine ripples around the frogs, a single white water lily
        bloom near one of the pads, warm amber afternoon light
    - label: "B: Frog pond cool overcast"
      prompt: >-
        extreme closeup of a still frog pond surface filling the entire frame,
        broad green lillypads floating on the dark calm water, two small
        speckled frogs perched on separate lillypads, soft diffuse overcast
        light reflecting on the water surface, scattered duckweed and reeds
        at the margins, fine ripples around the frogs, a single white water
        lily bloom near one of the pads, cool pale silver light
    - label: "C: Frog pond dusk"
      prompt: >-
        extreme closeup of a still frog pond surface filling the entire frame,
        broad green lillypads floating on the dark calm water, two small
        speckled frogs perched on separate lillypads, fading dusk light
        reflecting on the darker water surface, scattered duckweed and reeds
        at the margins, fine ripples around the frogs, a single white water
        lily bloom near one of the pads, warm low sunset light at low angle
    - label: "A (return): Frog pond amber"
      prompt: >-
        extreme closeup of a still frog pond surface filling the entire frame,
        broad green lillypads floating on the dark calm water, two small
        speckled frogs perched on separate lillypads, dappled warm sunlight
        reflecting on the water surface, scattered duckweed and reeds at the
        margins, fine ripples around the frogs, a single white water lily
        bloom near one of the pads, warm amber afternoon light

resolution:
  width: 1344
  height: 768

frames:
  steady: 2
  transition: 1
  return_: 1
  warmup: 3

# Border-test specific: edge_crop = 0.
rife:
  passes: 6
  skip_boundary: 4
  edge_crop: 0
  sinusoidal: false
  vendor_path: vendor/rife_v425

encoding:
  fps: 24
  quality: 5
  codec: libx264
  pixelformat: yuv420p

borders:
  crops_coords_top_left: [256, 256]
  original_size: [1024, 1024]
  latent_edge_px: 3
  latent_edge_strength: 0.3

models:
  sdxl_base: stabilityai/stable-diffusion-xl-base-1.0
  lightning_lora: ByteDance/SDXL-Lightning
  lightning_weight_name: sdxl_lightning_4step_lora.safetensors
  vae: madebyollin/taesdxl

output_dir: outputs/border-test
output_name: casa_frog_pond_20s_nocrop
